services:
  - type: web
    name: discord-stream-watcher
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: TOKEN
        sync: false
      - key: SERVER_ID
        sync: false
      - key: VOICE_CHANNEL_ID
        sync: false
